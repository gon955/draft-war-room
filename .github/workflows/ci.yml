name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: warroom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/warroom_test
      JWT_SECRET: 09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.lock, not requirements.txt — the lock is what the
      # Dockerfile installs, so testing against a fresh resolution of the
      # unpinned file means CI is green about a dependency set that never
      # reaches production. requirements-dev.txt stays unpinned: it is tooling,
      # it does not ship, and nothing in the image imports it.
      - run: pip install -r requirements.lock -r requirements-dev.txt

      - name: the lock and the image agree
        run: pip check

      - run: ruff check .

      - run: ruff format --check .

      - run: alembic upgrade head

      - name: migrations are reversible
        run: |
          alembic downgrade -1
          alembic upgrade head

      # Autogenerate against the migrated schema. Catches the drift the
      # fixtures cannot: conftest builds its tables from Base.metadata, so a
      # model change with no migration passes every test and then fails on
      # deploy, where the release step runs the migrations instead.
      - name: models match the migrations
        run: alembic check

      - run: pytest -v

  # Independent of `tests`, and deliberately so: this job catches a different
  # class of failure — a dependency that resolves on a laptop but not on
  # linux/amd64, a file missing from a COPY, a CMD that does not start. Running
  # it in parallel means a broken image is known in about a minute rather than
  # after the whole suite.
  docker:
    name: image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Dockerfile installs from requirements.lock, but CI's test job
      # installs from requirements.txt — so a dependency added to one and not
      # the other produces an image missing it while everything stays green.
      - name: requirements.lock covers requirements.txt
        run: python3 scripts/check_lock.py

      - name: Build
        run: docker build -t warroom-api:ci .

      - name: Image starts and serves /health
        env:
          # Deliberately unreachable. db.py builds its engine at import but
          # connects lazily, so the app boots and answers /health with no
          # database at all — which is why this job needs no Postgres service.
          DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:5432/unused
          JWT_SECRET: ci-smoke-test-secret-not-a-real-one
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL -e JWT_SECRET warroom-api:ci

          # `if` guards the curl: a bare `curl -sf` that fails would abort the
          # whole step, because Actions runs these under `bash -e`.
          ready=""
          for _ in $(seq 1 30); do
            if curl -sf -m 2 http://127.0.0.1:8000/health >/dev/null; then ready=1; break; fi
            sleep 1
          done

          if [ -z "$ready" ]; then
            echo "::error::the image never became healthy"
            docker logs api
            exit 1
          fi

          echo "health:   $(curl -s -m 2 http://127.0.0.1:8000/health)"

          # The probes must disagree here, and that is the point of having two.
          # This container has no database, so liveness is 200 (the process is
          # fine) and readiness is 503 (it cannot serve). If /ready answered 200
          # the split has collapsed and a machine with a dead database would
          # stay in the load balancer.
          ready=$(curl -s -m 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)
          echo "GET /ready: $ready (expected 503 — no database in this job)"
          test "$ready" = 503

          # The dev console must not ship. main.py only registers GET /dev when
          # frontend/dev.html exists, and .dockerignore excludes it — so a 200
          # here means the exclusion broke and a debug page is live in prod.
          dev=$(curl -s -m 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/dev)
          echo "GET /dev: $dev (expected 404)"
          test "$dev" = 404

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Runs HERE rather than in the frontend job because a running API is
      # needed, and this job already has one — with no database, since
      # /openapi.json is served from the app's own schema definitions.
      - name: generated types match the live OpenAPI
        working-directory: frontend
        run: |
          npm ci
          npx openapi-typescript http://127.0.0.1:8000/openapi.json -o /tmp/types.generated.ts
          # `diff`, not `git diff --exit-code`: the latter silently passes on a
          # file git is not tracking, so it would be a no-op the moment someone
          # regenerates types without committing them.
          diff -u src/lib/types.ts /tmp/types.generated.ts

  # Independent of both other jobs: typecheck, lint and build need no API and no
  # database. tsc is the one that earns its place — with types generated from
  # the OpenAPI document, a renamed Pydantic field becomes a compile error here
  # instead of `undefined` on a page.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 requires >= 20.9.0.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run typecheck`, not a bare `tsc --noEmit`: it runs
      # `next typegen` first. Next 16 generates the route helper types
      # (LayoutProps, PageProps) into .next/types, and `next build`
      # generates them as a side effect — so on a developer's machine a
      # stale .next from an earlier build makes tsc pass, while a clean
      # checkout here fails with "Cannot find name 'LayoutProps'".
      # Pairing them means this step means the same thing in both places.
      - run: npm run typecheck

      # `eslint`, not `next lint` — that command was removed in Next 16, and
      # `next build` no longer lints on its own.
      - run: npm run lint

      # Writes out/ — the static export Cloudflare Pages serves. The variable
      # is required: next.config.ts refuses a production build without it,
      # because NEXT_PUBLIC_* is inlined into the bundle and an unset value
      # ships a site calling 127.0.0.1. The value here is a stand-in — CI only
      # proves the build works — and the REAL origin must be set in the
      # Cloudflare Pages project, or the deployed site calls this one.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://warroom-api.invalid

      # The static export cannot send headers on its own (output: "export"
      # disables next.config's headers()), so they come from a generated
      # _headers file that only Cloudflare reads. Nothing else would notice it
      # going missing.
      - name: the export carries its security headers
        run: |
          test -f out/_headers
          grep -q "Content-Security-Policy" out/_headers
          grep -q "connect-src 'self' https://warroom-api.invalid" out/_headers
