# Fly.io deploy config. The Dockerfile is the portable part; this file is the
# only host-specific piece. Railway/Render equivalents are in the README's
# "Deploying" section.

app = "warroom-api"

# MUST match the region your Postgres lives in. The API makes up to 4 sequential
# round trips per request (POST /mocks/{id}/picks is the worst), so every
# millisecond of distance is paid several times over on every call.
primary_region = "iad"

[build]
  # Nothing here: Fly builds ./Dockerfile by default.

[env]
  # Fly does not inject PORT, so the Dockerfile's ${PORT:-8000} default would
  # apply. Setting it explicitly keeps this file and internal_port in one place.
  PORT = "8080"

  # Off in production: /docs and /openapi.json publish every route, parameter
  # and schema in the app. The frontend needs neither — its types are generated
  # from the document in CI, at build time, not read from the live server.
  DOCS_ENABLED = "false"

  # NOT set here, and they must be set with `fly secrets set`:
  #   DATABASE_URL   JWT_SECRET   FERNET_KEY   ESPN_S2   ESPN_SWID
  # [env] values are baked into the image metadata and readable by anyone who
  # can inspect it. CORS_ORIGINS is not a secret but is deployment-specific;
  # see the README.

[deploy]
  # Runs `alembic upgrade head` in a ONE-OFF machine from the new image, and
  # only promotes the release if it exits 0. This is why migrations do not live
  # in CMD: with three replicas booting at once, three Alembic processes would
  # race for the same version row.
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true

  # Scale to zero between drafts. The trade is a cold start on the first request
  # after idle — set min_machines_running = 1 on draft day, when a few seconds
  # of wake-up while the clock runs is the wrong kind of surprise.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    # Matched to REQUEST_THREAD_LIMIT (config.py, default 32), which is the real
    # concurrency of the process: every route is a sync `def`, so each in-flight
    # request occupies one AnyIO worker thread. Admitting more than that does
    # not serve more — it queues them inside the process, where the proxy can no
    # longer see the backlog and route around it. The previous 40/80 was exactly
    # that: double the capacity, invisible.
    type = "requests"
    soft_limit = 20
    hard_limit = 32

  [[http_service.checks]]
    # /health, not /ready, and the choice matters.
    #
    # /health touches nothing but the process, so a failure means the process
    # itself is wedged — worth a restart. /ready runs SELECT 1, so it also fails
    # when Postgres is unreachable, and restarting an app machine does not fix
    # Postgres: with every machine sharing one database they would all fail
    # together, all restart together, and the outage would gain a crash loop on
    # top of it.
    #
    # /ready is for MONITORING — point an alert at it to tell "the database is
    # gone" apart from "the app is gone", which is the one distinction a
    # liveness check cannot make. It also belongs on a load-balancer readiness
    # check in a topology where machines can lose their database independently.
    # This one cannot.
    path = "/health"
    method = "GET"
    interval = "30s"
    # 10s, not 5s — headroom kept deliberately after the cost came down.
    #
    # A full-draft POST /mocks/{id}/simulate used to be 5.3s of pure Python,
    # and three concurrent ones pushed /health from 50ms to 1.3s. engine.py's
    # seating and eligibility fixes took that to 0.43s, with /health staying
    # under 75ms under the same load. 5s would now be survivable; 10s is kept
    # because the failure it guards against is the platform restarting a
    # machine MID-DRAFT over load rather than a fault, and the only cost of the
    # wider margin is noticing a genuinely wedged process one interval later.
    timeout = "10s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 512 MB, and the number that decides it is argon2's memory.
  #
  # passlib's argon2 defaults are m=65536 KiB (64 MiB) per hash, with nothing
  # bounding how many run at once: 20 concurrent unauthenticated POSTs to
  # /auth/login measured at 899 MiB RSS — an OOM kill from anyone with curl and
  # no account. config.py now sets m=19456 (OWASP) and caps concurrency at 4,
  # and the Dockerfile sets MALLOC_ARENA_MAX=2 so freed arenas are handed back
  # instead of parked per worker thread. The same load now peaks at 94 MiB.
  #
  # Neither fix alone was enough: with the concurrency cap but WITHOUT the
  # arena limit the same run settled at 455 MiB and never came back down.
  #
  # Raising PASSWORD_HASH_CONCURRENCY or ARGON2_MEMORY_KIB, or dropping
  # MALLOC_ARENA_MAX, is the way back to that OOM.
  memory = "512mb"
